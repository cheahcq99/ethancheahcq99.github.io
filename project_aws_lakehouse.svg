  <text x="890" y="105" fill="#E8E6E1" font-family="Space Grotesk, sans-serif" font-size="13" text-anchor="middle">dbt tests</text>
  <text x="890" y="123" fill="#9AA5B1" font-family="JetBrains Mono, monospace" font-size="9" text-anchor="middle">schema + custom</text>

