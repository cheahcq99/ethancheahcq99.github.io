  <text x="80" y="123" fill="#9AA5B1" font-family="JetBrains Mono, monospace" font-size="10" text-anchor="middle">source</text>

  <!-- Arrow -->
  <line x1="140" y1="110" x2="185" y2="110" stroke="#B87333" stroke-width="2"/>
  <polygon points="185,105 195,110 185,115" fill="#B87333"/>

  <!-- S3 Bronze -->
  <rect x="195" y="70" width="140" height="80" rx="6" fill="#1C2229" stroke="#B87333" stroke-width="2"/>
