  <rect x="595" y="70" width="150" height="80" rx="6" fill="#1C2229" stroke="#D4AF37" stroke-width="2"/>
  <text x="670" y="96" fill="#E8E6E1" font-family="Space Grotesk, sans-serif" font-size="14" text-anchor="middle">dbt-athena</text>
  <text x="670" y="114" fill="#D4AF37" font-family="JetBrains Mono, monospace" font-size="11" text-anchor="middle">Gold</text>
