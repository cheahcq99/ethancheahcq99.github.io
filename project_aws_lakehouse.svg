  <text x="265" y="118" fill="#B87333" font-family="JetBrains Mono, monospace" font-size="11" text-anchor="middle">Bronze</text>
  <text x="265" y="134" fill="#9AA5B1" font-family="JetBrains Mono, monospace" font-size="9" text-anchor="middle">raw Parquet</text>

  <!-- Arrow -->
  <line x1="335" y1="110" x2="380" y2="110" stroke="#B87333" stroke-width="2"/>
  <polygon points="380,105 390,110 380,115" fill="#B87333"/>
  <text x="357" y="95" fill="#9AA5B1" font-family="JetBrains Mono, monospace" font-size="9" text-anchor="middle">Glue</text>

  <!-- S3 Silver + Glue Catalog -->
  <rect x="390" y="70" width="150" height="80" rx="6" fill="#1C2229" stroke="#9AA5B1" stroke-width="2"/>
  <text x="465" y="96" fill="#E8E6E1" font-family="Space Grotesk, sans-serif" font-size="14" text-anchor="middle">S3 + Catalog</text>
  <text x="465" y="114" fill="#9AA5B1" font-family="JetBrains Mono, monospace" font-size="11" text-anchor="middle">Silver</text>
  <text x="465" y="130" fill="#9AA5B1" font-family="JetBrains Mono, monospace" font-size="9" text-anchor="middle">typed + cataloged</text>

  <!-- Arrow -->
  <line x1="540" y1="110" x2="585" y2="110" stroke="#D4AF37" stroke-width="2"/>
